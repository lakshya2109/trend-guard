# trend-guard v2: every parameter the bot uses. The live engine and the backtest read this same file,
# so a change here is a reviewed `strat:` commit, never a manual action. Evidence for each value is in
# docs/STRATEGY.md ("Research log") and reproducible with `python backtest/sweep.py`.
competition:
  start_utc: "2026-10-04T12:00:00Z"    # Roostoo competition 538 (/v1/competition_list StartTS 1791115200)
  end_utc:   "2026-10-18T12:00:00Z"    # EndTS 1792324800: 14 days, 20:00 HKT to 20:00 HKT
  risk_scale: 1.0                      # multiplies every target; 0.1 for a live dry run
  # Qualification-first terminal mode (15 Oct): today's HK #20 is $97,255. Lock above it with
  # a ~$1,245 buffer: the cutoff tends to rise in the same rally the rebound needs, and at 98,000 a
  # 1% higher cutoff left the lock below it (STRATEGY.md 29). Two minute snapshots avoid flattening
  # on one transient exchange valuation.
  profit_lock_equity: 98500
  profit_lock_confirm_cycles: 2

book:
  v2_share: 0.7                        # trend-guard v2 sleeves (below) get 70% of the account...
  team_share: 0.3                      # ...and the teammates' combined book 30% (each level sums <= 1: no leverage)
  trend_share: 0.7                     # within v2: the low-vol trend sleeve
  momentum_share: 0.3                  # within v2: the long/short momentum sleeve
  allow_short: true                    # set false if /v6 shorts are disabled for the account
  risk_multiplier: 4.0                 # aggressive: ~97% of equity invested, highest return that keeps the rank (STRATEGY.md 15)
  max_gross: 1.0                       # hard cap after the multiplier: longs + short collateral <= equity
  team:                                # Gunek-945 trend book + swyam-rd momentum book (strategy/team, unmodified)
    trend_share: 0.7
    momentum_share: 0.3
    momentum_vol_target: 0.015
  trend:
    lookback_sets: [[168, 336, 720], [168, 336, 720, 1440]]   # 7/14/30 and 7/14/30/60 days
    min_scores: [0.25, 0.4]            # members average over both entry thresholds
    score_cap: 2.0
    vol_window_h: 168
    target_vol_daily: 0.004            # low on purpose: the score is scale-free, qualifying (> -1%) is not
    max_weight: 0.5
    min_weight: 0.01                   # a position under 1% cannot earn back its 0.3% round trip
    gross_cap: 1.0
    cov_hours: 336                     # local research finding: was 168 (7 days), doubled to 14 for a more
                                        # stable correlation structure (up to dozens of held names against
                                        # only 168 hourly observations is a small-sample regime).
    cov_shrink: 0.1                    # additionally shrink toward the momentum sleeve's own constant-
                                        # correlation model (same small-sample motivation).
    cov_shrink_rho: 0.7
    cov_ewma_halflife_h: 72.0          # recency-weight the (now longer) window so it still reacts to a
                                        # fresh vol pickup instead of averaging it away -- without this, the
                                        # longer window raised return and rank but quietly cost Sharpe/
                                        # Sortino (0.085/0.144 -> 0.080/0.140); with it, every metric is
                                        # better than the untouched original, including both ratios
                                        # (-> 0.096/0.162), not just return. Full comparison and the
                                        # diagnosis: local research notes, not yet in upstream STRATEGY.md.
    rebalance_hour_utc: 12
    min_liquidity_usd: 2000000
    min_age_h: 336
    exclude: []
  momentum:
    lookback_sets: [[72, 168, 336], [168, 336, 720]]          # 3/7/14 and 7/14/30 days
    skips: [0, 12]                     # members with and without skipping the latest 12h
    k: 6
    buffer: 12
    short_share: 0.4
    vol_weight_power: 0.5              # within a side weight ~ 1/sqrt(vol), not equal (research/paired.py, STRATEGY.md 18)
    target_vol_daily: 0.015
    avg_corr: 0.7
    gross_cap: 0.9
    select_hour_utc: 0
    ewma_lambda: 0.99
    min_liquidity_usd: 5000000
    min_age_h: 720
    exclude: ["PAXG/USD"]              # gold is not crypto momentum
    short_crash_return: -0.40          # no NEW shorts on coins down > 40% over 60 days: crashed losers bounce
    short_crash_lookback_h: 1440

  bear_mode:                           # terminal catch-up: in a broad 9-day crash run the rebound book
    enabled: true                      # deliberately raises P(cross current HK #20), with a much worse loss tail
    lookback_h: 216                    # market = mean return of liquid coins over the last 9 days
    enter: -0.05                       # enter after a broad decline below -5% ...
    exit: 0.00                         # ... stay until that 9-day market return fully recovers
    min_liquidity_usd: 5000000
    select_every_h: 6
    book: rebound                      # bear-mode book: hold the 10 coins that fell most over 3 days (oversold
    rebound_k: 10                      # bounce; research/rebound.py: after crashes P(> +4.5%) 27% -> 42%,
    rebound_lookback_h: 72             # best in 34 of 50 crash episodes), re-picked daily at 00 UTC
    rebound_hour_utc: 0
  net_hedge:                           # short the 10 most liquid coins against half the book's net long (STRATEGY.md 25:
    enabled: true                      # max drawdown 24.6% -> 16.1%, Sharpe 1.95 / 2.65 -> 2.03 / 2.96, P 67%: not proven)
    frac: 0.5
    n_coins: 10
    min_liquidity_usd: 5000000
    min_age_h: 720
    exclude: ["PAXG/USD"]
  jump_guard:                         # no new / larger longs for 24h after a +10% hour: 2025-26 pumps revert
    enabled: true                      # (research/paired.py: Sharpe +0.06, P 97.5%, better in 2024-25 and 2026)
    threshold: 0.10
    hold_h: 24
  crash_hedge:                          # short COIN/MSTR tokens on a BTC crash (teammate branch swyam/bstocks-hedge)
    enabled: false                     # OFF: the live universe excludes stock tokens (universe.py) and there is
                                        # no stock-token bar feed, so the hedge could never trade live; its
                                        # 2024-25 test priced the tokens with US stock hours. Enabling it needs
                                        # the live plumbing from swyam/bstocks-hedge and /v6 stock shorts confirmed.
    instruments: ["COINB/USD", "MSTRB/USD"]
    trigger_72h: -0.06
    trigger_24h: -0.04
    size: 0.75
    check_hours_utc: [0, 12]
    reference: "BTC/USD"

breaker:                               # catastrophe circuit breaker only; tighter brakes hurt the score
  dd_level: 0.20                       # 0.10 until 9 Oct: from ~7% down it halved the rebound (research/breaker_now.py)
  dd_mult: 0.5
  dd_recover: 0.05
  confirm_cycles: 2                    # trip only after 2 hourly readings past dd_level (8 Oct: a false $74.8k reading)

execution:
  rebalance_minute: 3
  decision_hours_utc: [0, 12]
  min_trade_weight: 0.01
  min_trade_frac: 0.25
  cash_buffer: 0.005
  limit_reprice_s: 60
  limit_max_tries: 4
  ticker_poll_s: 30
  requests_per_min: 25                 # hard cap per rolling 60 s; the exchange allows 30, the margin covers network jitter
  min_order_gap_s: 1.0
  history_hours: 2400
  activity_windows_utc: [[1, 3], [13, 15]]   # no fill since a window opened -> one small trade (>= 8 active days); just after the 00 / 12 UTC decision bars close, same date in UTC and HKT
  activity_min_frac: 0.001             # that trade is the book's largest gap to target, at least 0.1% of equity
  activity_fallback_pair: "BTC/USD"    # only if the book holds and targets nothing at all

backtest:
  first_window: "2024-02-15"
  last_window: "2026-09-15"
  window_hour_utc: 12
  window_days: 14
  fee: 0.001
  slippage: 0.0005
  capital: 100000
  maker_fee: 0.0005
  taker_fee: 0.0010
  short_fee: 0.0010
  slippage_bps: 5
