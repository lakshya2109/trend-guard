# trend-guard v2: every parameter the bot uses. The live engine and the backtest read this same file,
# so a change here is a reviewed `strat:` commit, never a manual action. Evidence for each value is in
# docs/STRATEGY.md ("Research log") and reproducible with `python backtest/sweep.py`.
competition:
  start_utc: "2026-10-04T12:00:00Z"    # Roostoo competition 538 (/v1/competition_list StartTS 1791115200)
  end_utc:   "2026-10-18T12:00:00Z"    # EndTS 1792324800: 14 days, 20:00 HKT to 20:00 HKT
  risk_scale: 1.0                      # multiplies every target; 0.1 for a live dry run

book:
  v2_share: 0.7                        # trend-guard v2 sleeves (below) get 70% of the account...
  team_share: 0.3                      # ...and the teammates' combined book 30% (each level sums <= 1: no leverage)
  trend_share: 0.7                     # within v2: the low-vol trend sleeve
  momentum_share: 0.3                  # within v2: the long/short momentum sleeve
  allow_short: true                    # set false if /v6 shorts are disabled for the account
  risk_multiplier: 4.0                 # aggressive: ~97% of equity invested, highest return that keeps the rank (STRATEGY.md 15)
  max_gross: 1.0                       # hard cap after the multiplier: longs + short collateral <= equity
  team:                                # Gunek-945 trend book + swyam-rd momentum book (strategy/team, unmodified)
    trend_share: 0.7
    momentum_share: 0.3
    momentum_vol_target: 0.015
  trend:
    lookback_sets: [[168, 336, 720], [168, 336, 720, 1440]]   # 7/14/30 and 7/14/30/60 days
    min_scores: [0.25, 0.4]            # members average over both entry thresholds
    score_cap: 2.0
    vol_window_h: 168
    target_vol_daily: 0.004            # low on purpose: the score is scale-free, qualifying (> -1%) is not
    max_weight: 0.5
    min_weight: 0.01                   # a position under 1% cannot earn back its 0.3% round trip
    gross_cap: 1.0
    cov_hours: 336                     # local research finding: was 168 (7 days), doubled to 14 for a more
                                        # stable correlation structure (up to dozens of held names against
                                        # only 168 hourly observations is a small-sample regime).
    cov_shrink: 0.1                    # additionally shrink toward the momentum sleeve's own constant-
                                        # correlation model (same small-sample motivation).
    cov_shrink_rho: 0.7
    cov_ewma_halflife_h: 72.0          # recency-weight the (now longer) window so it still reacts to a
                                        # fresh vol pickup instead of averaging it away -- without this, the
                                        # longer window raised return and rank but quietly cost Sharpe/
                                        # Sortino (0.085/0.144 -> 0.080/0.140); with it, every metric is
                                        # better than the untouched original, including both ratios
                                        # (-> 0.096/0.162), not just return. Full comparison and the
                                        # diagnosis: local research notes, not yet in upstream STRATEGY.md.
    rebalance_hour_utc: 12
    min_liquidity_usd: 2000000
    min_age_h: 336
    exclude: []
  momentum:
    lookback_sets: [[72, 168, 336], [168, 336, 720]]          # 3/7/14 and 7/14/30 days
    skips: [0, 12]                     # members with and without skipping the latest 12h
    k: 6
    buffer: 12
    short_share: 0.4
    target_vol_daily: 0.015
    avg_corr: 0.7
    gross_cap: 0.9
    select_hour_utc: 0
    ewma_lambda: 0.99
    min_liquidity_usd: 5000000
    min_age_h: 720
    exclude: ["PAXG/USD"]              # gold is not crypto momentum
    short_crash_return: -0.40          # no NEW shorts on coins down > 40% over 60 days: crashed losers bounce
    short_crash_lookback_h: 1440

  crash_hedge:                          # ported from teammate branch swyam/bstocks-hedge, re-validated
    enabled: true                      # against the cov_336 book (local research notes): every tracked
    instruments: ["COINB/USD", "MSTRB/USD"]   # metric improves or ties except a noise-level P(rank1) dip.
    trigger_72h: -0.06                 # needs /v6 shorts-on-stocks confirmed enabled on the account before
                                        # this is actually live -- same precondition as the source branch.
    trigger_24h: -0.04
    size: 0.75
    check_hours_utc: [0, 12]
    reference: "BTC/USD"

breaker:                               # catastrophe circuit breaker only; tighter brakes hurt the score
  dd_level: 0.10
  dd_mult: 0.5
  dd_recover: 0.05

execution:
  rebalance_minute: 3
  decision_hours_utc: [0, 12]
  min_trade_weight: 0.01
  min_trade_frac: 0.25
  cash_buffer: 0.005
  limit_reprice_s: 60
  limit_max_tries: 4
  ticker_poll_s: 30
  requests_per_min: 30
  min_order_gap_s: 1.0
  history_hours: 2400

backtest:
  first_window: "2024-02-15"
  last_window: "2026-09-15"
  window_hour_utc: 12
  window_days: 14
  fee: 0.001
  slippage: 0.0005
  capital: 100000
  maker_fee: 0.0005
  taker_fee: 0.0010
  short_fee: 0.0010
  slippage_bps: 5
